id: BR-FACT-021
type: BusinessRule
capability: facturation

statement: >
  Le montant de chaque ligne de facture est calculé avec une précision de
  4 décimales et un arrondi au demi-supérieur (HALF_UP), puis stocké tel quel.
  L'affichage et l'export comptable n'en présentent que 2.

confidence: V
confidence_reason: >
  Promue en V : le test de caractérisation forgé (CT-FACT-021) passe sur le
  code actuel et couvre les trois cas d'arrondi limites. Le type DECIMAL(12,4)
  en base corrobore mécaniquement la précision.


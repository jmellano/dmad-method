id: DIA-STD-002
kind: sequence
document: DOC-STD-FACT-001
question: "dans quel ordre les composants s'appellent-ils pour une facture, et où sort-on du périmètre ?"
confidence: C
caveats: "une frontière non franchie en aval"
participants:
  - {id: R, label: BillingRun}
  - {id: D, label: InvoiceDispatcher}
  - {id: C, label: AmountCalculator}
  - {id: P, label: PricingClient}
  - {id: A, label: AccountingGateway}
steps:
  - msg: {from: R, to: D, label: "dispatch(invoice)"}
  - loop: "par ligne"
  - msg: {from: D, to: C, label: "compute(line)"}
  - msg: {from: C, to: P, label: "barème du client"}
  - msg: {from: P, to: C, label: "barème", reply: true}
  - end: true
  - alt: "montant nul et paramètre actif"
  - msg: {from: D, to: D, label: "markSkipped()"}
  - else: ""
  - msg: {from: D, to: A, label: "transmettreFacture()"}
  - msg: {from: A, to: D, label: "accusé", reply: true}
  - end: true
  - note: {over: A, text: "comportement aval non analysé"}

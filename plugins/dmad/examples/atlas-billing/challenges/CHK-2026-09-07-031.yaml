id: CHK-2026-09-07-031
claim: BR-FACT-014
challenged_at: "2026-09-07T13:18:00Z"

angles_examined: [1, 2, 3, 4, 5, 6, 7, 8]
angles_skipped:
  - angle: 9
    reason: >
      Concurrence sans objet : le dispatcher est appelé depuis un batch
      mono-thread et depuis une route synchrone qui traite une facture à la
      fois (vérifié : aucun pool, aucun accès concurrent à invoices.status).

findings:
  - angle: 3
    severity: high
    finding: >
      Le comportement est conditionné par le paramètre billing.skipZeroAmount,
      valorisé à true en production et en recette, mais dont la valeur par
      défaut dans le code est false.
    evidence: "src/config/BillingConfig.java#L34, config/application-prod.yml#L88"
    consequence: >
      La claim initiale, formulée sans condition, serait vraie pour un lecteur
      qui observe la production et fausse pour un développeur qui lance le
      projet en local. C'est exactement le type d'affirmation qui fait perdre
      confiance dans toute la documentation.
  - angle: 7
    severity: medium
    finding: >
      L'énoncé initial affirmait « n'est jamais transmise ». Sur les 3 appelants
      de dispatch(), un seul passe par la garde : CLI reinvoice appelle
      directement AccountingGateway.send() sans franchir InvoiceDispatcher.
    evidence: "src/billing/cli/ReinvoiceCommand.java#L47"
    consequence: >
      Une facture à montant nul PEUT être transmise via la commande de
      refacturation manuelle. L'exhaustivité était fausse.

outcome: demoted
from: C
to: I
required_action: >
  Reformuler la règle en explicitant la condition d'activation ET en
  restreignant sa portée au chemin InvoiceDispatcher. Ouvrir une question sur
  le contournement par la CLI. Re-soumettre au Challenger après reformulation.
opened_questions:
  - OQ-019

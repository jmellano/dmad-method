    Pouvoir faire évoluer les règles de facturation (nouveau barème au 01/01)
    sans risquer de régression comptable, alors que plus personne dans l'équipe
    ne connaît le calcul des montants.
  kind: evolve

mode: feature-scan

perimeter:
  repositories:
    - github.com/acme/atlas-erp
  include:
    - src/billing
    - src/accounting
    - src/catalog
    - db/migrations
  exclude:
    - path: src/legacy-import
      reason: "arrêté en 2021, aucun appel entrant depuis (vérifié : 0 référence)"
    - path: src/reporting-v1
      reason: "remplacé par reporting-v2, hors objectif de la mission"
    - path: vendor/
      reason: "dépendances tierces, non modifiables"
  feature:
    label: "Facturation"
    vocabulary:
      - facture
      - avoir
      - échéance
      - relance
      - barème
      - campagne de facturation
    known_entrypoints:
      - "POST /invoices"
      - "JOB nightly-billing"


id: OQ-019
question: >
  La commande de refacturation manuelle (CLI reinvoice) doit-elle appliquer
  les mêmes règles que la facturation automatique ?
context: >
  La facturation automatique écarte les factures à montant nul. La commande
  de refacturation manuelle, utilisée par le support, appelle directement le
  service d'envoi et contourne cette vérification. Les deux chemins produisent
  donc des résultats différents pour une même facture.
priority: P2
audience: both
why_it_matters: >
  Deux chemins d'exécution avec des règles divergentes sur le même objet
  métier. Selon la réponse à OQ-012, c'est soit une échappatoire volontaire
  laissée au support, soit un défaut qui contourne silencieusement une règle
  comptable.
options:
  - "Oui — la CLI doit passer par le même point d'entrée"
  - "Non — échappatoire volontaire pour le support, à documenter comme telle"
raised_by: challenger
raised_at: "2026-09-07T13:18:00Z"
related_claims:
  - BR-FACT-014
capability: facturation
status: open

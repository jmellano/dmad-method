# DMAD — workflow full-scan
# Tout le périmètre. Réaliste jusqu'à ~150 kLOC selon budget ; au-delà, les
# phases 4-6 sont priorisées par hotspots plutôt qu'exhaustives.
workflow:
  id: full-scan
  label: "Analyse complète du périmètre"
  default_for: "codebases < 150 kLOC, ou objectif de reprise de maintenance"

  preconditions:
    - "scope.mode == full-scan"

  phases:

    - id: 0-cadrage
      agent: scoper
      tasks: [00-scope-run]
      outputs: [scope.yaml]
      gate:
        checklist: gate-0-scope
        approver: commanditaire
        blocking: true

    - id: 1-reconnaissance
      agent: surveyor
      model: haiku
      tasks: [10-survey-codebase, 11-discover-entrypoints]
      outputs: [facts/]
      checkpoint:
        description: "Point de décision sur le volume, sans validation formelle"
        rule: >
          Si le recensement révèle un volume incompatible avec le budget, le
          Surveyor remonte l'écart AVANT la cartographie et propose : réduire
          le périmètre, basculer en feature-scan, ou accepter une élucidation
          limitée aux hotspots. Découvrir le dépassement en phase 4 coûte
          l'intégralité des phases 2 et 3.

    - id: 2-cartographie
      agent: cartographer
      model: haiku
      tasks: [20-build-graph]
      inputs: [facts/entrypoints.json (tous)]
      bounded_by: "scope.budget.max_traversal_depth"
      outputs: [graph/, boundaries.yaml]

    - id: 3-decoupage
      agent: carver
      model: opus
      tasks: [30-carve-capabilities]
      outputs: [capabilities.yaml]
      gate:
        checklist: gate-3-capabilities
        approver: expert métier
        blocking: true

    - id: 4-elucidation
      parallel:
        - agent: elucidator
          tasks: [40-elucidate-usecases, 41-extract-business-rules]
        - agent: archaeologist
          tasks: [42-reconstruct-intent]
      order_by: hotspot_rank
      budget_rule: >
        Quand le budget s'épuise, on s'arrête sur une capacité TERMINÉE plutôt
        que d'en laisser six à moitié faites. Une capacité documentée en
        entier vaut mieux que six ébauches — et le rapport de couverture dit
        clairement lesquelles ont été traitées.
      outputs: [claims/ (draft)]

    - id: 5-challenge
      sequence:
        - agent: challenger
          model: opus
          tasks: [50-challenge-claim]
        - agent: test-forger
          tasks: [51-forge-characterization-test]
      gate:
        checklist: gate-5-challenge
        approver: [développeur, référent métier]
        blocking: true

    - id: 6-restitution
      sequence:
        - agent: diagram-planner
          tasks: [60-plan-diagrams]
        - parallel:
            - agent: writer-functional
              tasks: [61-render-functional-doc]
            - agent: writer-technical
              tasks: [62-render-technical-doc]
        - agent: curator
          tasks: [70-compute-coverage]
      outputs: [dmad-output/]
      gate:
        checklist: release-readiness
        approver: commanditaire
        blocking: true

    - id: 7-maintien
      agent: curator
      tasks: [71-check-freshness]
      recurring: true

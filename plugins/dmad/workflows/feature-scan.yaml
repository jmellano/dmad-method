# DMAD — workflow feature-scan
# Le mode par défaut sur les gros legacy : on ne lit pas le projet, on remonte
# depuis un vocabulaire métier vers les points d'entrée d'une capacité.
workflow:
  id: feature-scan
  label: "Analyse d'une fonctionnalité"
  default_for: "codebases > 150 kLOC, ou objectif portant sur un domaine nommé"

  preconditions:
    - "scope.mode == feature-scan"
    - "scope.perimeter.feature.vocabulary contient >= 3 termes"

  corpus: "scope.corpus"

  cycles:

    - id: 0-cadrage
      agent: scoper
      tasks: [00-scope-run]
      outputs: [scope.yaml, glossary-seed.md]
      gate:
        checklist: gate-0-scope
        approver: commanditaire
        blocking: true

    # -------------------------------------------------------------- cycle 1
    - id: 1-reconnaissance
      agent: surveyor
      model: haiku
      tasks: [10-survey-codebase]
      note: >
        Sur le périmètre COMPLET, pas seulement la feature : le recensement est
        peu coûteux et rater un point d'entrée coûte beaucoup plus cher que de
        tous les recenser.
      outputs: [facts/]

    - id: 1b-localisation
      agent: surveyor
      tasks: [12-locate-feature]
      description: "Localise la feature par vocabulaire, données, historique, tests, surface externe"
      outputs: [feature-candidates.yaml]
      gate:
        checklist: null
        approver: commanditaire
        blocking: true
        question: >
          Voici les points d'entrée candidats, classés par force de signal.
          Lesquels appartiennent réellement à la fonctionnalité ?
        rationale: >
          Dix minutes d'un humain ici économisent des heures de traversée dans
          la mauvaise direction. C'est le meilleur rapport coût/valeur de tout
          le workflow.

    - id: 1a-cartographie
      agent: cartographer
      model: haiku
      tasks: [20-build-graph]
      inputs: [feature-candidates.yaml (confirmés)]
      bounded_by: "scope.budget.max_traversal_depth"
      outputs: [graph/, boundaries.yaml]

    - id: 1c-contrats
      agent: contract-resolver
      model: haiku
      tasks: [13-resolve-outbound-contracts]
      inputs: ["graph/ (feuilles de type contract)"]
      outputs: [contracts/]

    - id: 1d-restitution-std
      sequence:
        - agent: challenger
          model: opus
          tasks: [50-challenge-claim]
        - agent: diagram-planner
          tasks: [60-plan-diagrams]
        - agent: writer-std
          tasks: [63-render-std]
      gate:
        checklist: revue-cycle-1-std
        approver: développeur
        blocking: true
        allows: [corrections, complements]

    # Les cycles 2 et 3 sont identiques à ceux du full-scan — voir full-scan.yaml.
    # Seule différence : chaque document porte en tête l'avertissement de périmètre.
    - id: 2-sfd
      same_as: "full-scan#2-sfd"
      requires: "std figée"

    - id: 3-sfg
      same_as: "full-scan#3-sfg"
      requires: "sfd figée"

    - id: cloture
      agent: curator
      tasks: [70-compute-coverage]
      gate:
        checklist: release-readiness
        approver: commanditaire
        blocking: true

  # Règle d'honnêteté propre au mode : chaque document du corpus porte en tête
  # l'avertissement que les interactions hors périmètre n'ont pas été analysées,
  # avec la liste des frontières atteintes et non franchies.
  honesty_rule: "boundaries.yaml est publié dans les trois documents"
